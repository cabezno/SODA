[project]
name = "soda"
version = "0.1.0"
description = "Software Orchestration & Development Agency"
requires-python = ">=3.11"

dependencies = [
    # Fase A — drivers
    "anthropic",
    "google-generativeai",
    "ollama",
    "python-dotenv",
    # Fase B — kernel
    "fastapi",
    "uvicorn",
    "websockets",
    "docker",
    "watchdog",
    "pygithub",
    "gitpython",
    "pydantic",
    # Fase C — conocimiento y UI
    "chromadb",
    "pywebview",
    "sqlalchemy",
    "rich",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["obsolete", ".git", "__pycache__", ".venv", "node_modules"]
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
