version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - app-db-data:/var/lib/postgresql/data/
    env_file:
      - .env

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/app:/app/app
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "5173:5173"

volumes:
  app-db-data:
