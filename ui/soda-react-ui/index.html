<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet" />
    <title>BlackMagicBox Soda</title>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var errObj = document.createElement('div');
        errObj.style.color = 'red';
        errObj.style.background = 'white';
        errObj.style.padding = '10px';
        errObj.style.position = 'absolute';
        errObj.style.zIndex = 9999;
        errObj.style.top = '0';
        errObj.innerHTML = 'JS Error: ' + msg + '<br>Line: ' + lineNo + '<br>Col: ' + columnNo + '<br>Error: ' + (error ? error.stack : '');
        document.body.appendChild(errObj);
        return false;
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
