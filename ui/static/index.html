<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SODA Mission Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1e1e1e; color: #d4d4d4; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Top bar */
        #topbar {
            display: flex; align-items: center; gap: 16px;
            padding: 0 16px; height: 42px; min-height: 42px;
            background: #2d2d2d; border-bottom: 1px solid #3c3c3c; font-size: 12px;
        }
        #topbar .brand { font-weight: 700; font-size: 13px; color: #fff; letter-spacing: 1px; }
        #topbar .model-badge {
            padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600;
            background: #0e4a72; color: #4ec9b0; border: 1px solid #007acc;
        }
        #phase-track { display: flex; align-items: center; gap: 4px; margin-left: auto; }
        .phase-step {
            padding: 2px 10px; border-radius: 10px; font-size: 10px; font-weight: 600;
            background: #3c3c3c; color: #666; border: 1px solid #444; transition: all 0.3s ease;
        }
        .phase-step.active { background: #0e4a72; color: #fff; border-color: #007acc; }
        .phase-step.done   { background: #1e4620; color: #89d185; border-color: #4ec9b0; }
        .phase-sep { color: #444; font-size: 10px; }
        #status-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #444;
            margin-left: 8px; transition: background 0.3s;
        }
        #status-dot.running { background: #cca700; animation: pulse 1.2s infinite; }
        #status-dot.done    { background: #4ec9b0; }
        #status-dot.failed  { background: #f44747; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* Input bar */
        #input-bar {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 16px; background: #252526; border-bottom: 1px solid #3c3c3c;
            flex-shrink: 0;
        }
        #description-input {
            flex: 1; background: #1e1e1e; border: 1px solid #3c3c3c; border-radius: 4px;
            color: #d4d4d4; font-size: 12px; font-family: 'Segoe UI', sans-serif;
            padding: 5px 10px; resize: none; outline: none; line-height: 1.4;
            height: 30px; overflow: hidden; transition: height 0.2s ease, border-color 0.2s;
        }
        #description-input:focus { border-color: #007acc; height: 72px; overflow-y: auto; }
        #description-input:disabled { opacity: 0.4; cursor: not-allowed; }
        #run-btn {
            padding: 5px 18px; background: #007acc; color: #fff; border: none;
            border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer;
            white-space: nowrap; transition: background 0.2s, opacity 0.2s;
        }
        #run-btn:hover:not(:disabled) { background: #005fa3; }
        #run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Layout */
        #body { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar */
        #sidebar { width: 260px; min-width: 260px; background: #252526; border-right: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; }
        .panel-header { padding: 6px 12px; background: #2d2d2d; font-size: 10px; font-weight: 700; color: #888; letter-spacing: 1px; border-bottom: 1px solid #222; flex-shrink: 0; }

        /* Objective tree */
        #tree-wrap { overflow-y: auto; border-bottom: 1px solid #333; }
        #tree-wrap.hidden { display: none; }
        .tree-level { padding: 6px 12px 4px; }
        .tree-level-label { font-size: 9px; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .tree-modules { display: flex; flex-wrap: wrap; gap: 4px; }
        .mod-chip {
            padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 500;
            background: #2d2d2d; color: #666; border: 1px solid #3c3c3c;
            transition: all 0.25s ease; white-space: nowrap;
        }
        .mod-chip.running {
            background: #1a3a4a; color: #9cdcfe; border-color: #007acc;
            animation: pulse 1.2s infinite;
        }
        .mod-chip.done { background: #1a3020; color: #89d185; border-color: #3a7a3a; animation: none; }

        /* File list */
        #file-list { flex: 1; overflow-y: auto; min-height: 0; }
        .file-item {
            padding: 6px 12px; cursor: pointer; font-size: 12px;
            display: flex; align-items: center; gap: 6px;
            border-bottom: 1px solid #2d2d2d; color: #ccc;
        }
        .file-item:hover { background: #2a2d2e; }
        .file-item.active { background: #094771; color: #fff; }
        .file-icon { font-size: 11px; opacity: 0.7; }
        .file-validated { margin-left: auto; font-size: 10px; }
        .file-validated.ok   { color: #4ec9b0; }
        .file-validated.fail { color: #f44747; }

        /* Hardware — pinned footer */
        #hw-panel { padding: 8px 12px; border-top: 1px solid #333; background: #1e1e1e; flex-shrink: 0; }
        .hw-metric { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
        .hw-metric:last-child { margin-bottom: 0; }
        .hw-label { font-size: 10px; color: #555; width: 36px; flex-shrink: 0; }
        .hw-val   { font-size: 10px; color: #666; width: 30px; text-align: right; flex-shrink: 0; }
        .bar-bg   { flex: 1; height: 3px; background: #3c3c3c; border-radius: 2px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; transition: width 0.5s ease; border-radius: 2px; }
        .vram-fill { background: #007acc; }
        .cpu-fill  { background: #4ec9b0; }
        .ram-fill  { background: #ce9178; }

        /* Main */
        #main-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #editor-container { flex: 1; min-height: 0; }

        /* Console */
        #console-wrap { height: 190px; min-height: 190px; border-top: 2px solid #333; display: flex; flex-direction: column; }
        #console-header { display: flex; align-items: center; padding: 0 10px; height: 26px; background: #2d2d2d; border-bottom: 1px solid #222; font-size: 10px; font-weight: 700; color: #888; letter-spacing: 1px; }
        #console-clear { margin-left: auto; cursor: pointer; color: #555; font-size: 11px; padding: 2px 6px; }
        #console-clear:hover { color: #ccc; }
        #console { flex: 1; background: #0d0d0d; padding: 8px 10px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 12px; }
        .log-entry { margin-bottom: 3px; display: flex; gap: 8px; line-height: 1.5; }
        .log-time { color: #555; flex-shrink: 0; }
        .log-msg  { word-break: break-all; }
        .log-entry.START .log-msg         { color: #dcdcaa; }
        .log-entry.DONE .log-msg          { color: #4ec9b0; font-weight: 600; }
        .log-entry.FAILED .log-msg        { color: #f44747; font-weight: 600; }
        .log-entry.PHASE_START .log-msg   { color: #9cdcfe; }
        .log-entry.CHECKPOINT .log-msg    { color: #cca700; }
        .log-entry.FILE_GENERATED .log-msg { color: #b5cea8; }
        .log-entry.MODULE_START .log-msg  { color: #c586c0; }
        .log-entry.MODULE_DONE .log-msg   { color: #89d185; }
        .log-entry.CAPABILITIES .log-msg      { color: #dcdcaa; }
        .log-entry.WISDOM .log-msg            { color: #f0a050; }
        .log-entry.HEALTH_WARN .log-msg       { color: #f44747; font-weight: 600; }
        .log-entry.MODIFICATION_PLAN .log-msg { color: #9cdcfe; }
        .log-entry.IMPACT_REPORT .log-msg     { color: #c586c0; }
        .log-entry.EVOLUTION .log-msg         { color: #4ec9b0; }
        .log-entry.BRANCH_CREATED .log-msg    { color: #cca700; }
        .log-entry.REFOUNDATION .log-msg      { color: #dcdcaa; font-style: italic; }
        .log-entry.LOG .log-msg               { color: #666; }

        /* Wisdom panel — shows before pipeline runs */
        #wisdom-panel {
            border-top: 1px solid #333; background: #1a1a1a; flex-shrink: 0;
            max-height: 130px; overflow-y: auto;
        }
        #wisdom-panel.hidden { display: none; }
        .wisdom-item {
            display: flex; gap: 8px; padding: 5px 10px;
            border-bottom: 1px solid #222; font-size: 11px; line-height: 1.4;
        }
        .wisdom-tag {
            font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 2px;
            flex-shrink: 0; margin-top: 2px; text-transform: uppercase;
        }
        .wisdom-tag.ambiguity       { background: #4a3000; color: #f0a050; }
        .wisdom-tag.complexity      { background: #3a1a4a; color: #c586c0; }
        .wisdom-tag.missing_requirement { background: #003a3a; color: #4ec9b0; }
        .wisdom-tag.tradeoff        { background: #1a3a00; color: #89d185; }
        .wisdom-tag.warning         { background: #4a0000; color: #f44747; }
        .wisdom-tag.ok              { background: #1a3020; color: #89d185; }
        .wisdom-body { flex: 1; }
        .wisdom-msg  { color: #ccc; }
        .wisdom-sug  { color: #666; margin-top: 2px; font-style: italic; }

        /* Project chat — unlocks after DONE */
        #chat-wrap {
            border-top: 2px solid #333; flex-shrink: 0;
            display: flex; align-items: center; gap: 8px; padding: 6px 10px;
        }
        #chat-wrap.hidden { display: none; }
        #chat-input {
            flex: 1; background: #1e1e1e; border: 1px solid #3c3c3c; border-radius: 4px;
            color: #d4d4d4; font-size: 12px; font-family: 'Segoe UI', sans-serif;
            padding: 5px 10px; resize: none; outline: none; height: 28px;
            transition: border-color 0.2s, height 0.2s;
        }
        #chat-input:focus { border-color: #c586c0; height: 60px; }
        #chat-input:disabled { opacity: 0.4; }
        #chat-btn {
            padding: 5px 14px; background: #3a1a4a; color: #c586c0; border: 1px solid #c586c0;
            border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer;
            white-space: nowrap; transition: background 0.2s;
        }
        #chat-btn:hover:not(:disabled) { background: #5a2a6a; }
        #chat-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="topbar">
        <span class="brand">SODA</span>
        <span id="model-badge" class="model-badge">--</span>
        <div id="phase-track">
            <span class="phase-step" id="ph-capabilities">CAP</span>
            <span class="phase-sep">›</span>
            <span class="phase-step" id="ph-requirements">REQ</span>
            <span class="phase-sep">›</span>
            <span class="phase-step" id="ph-architecture">ARCH</span>
            <span class="phase-sep">›</span>
            <span class="phase-step" id="ph-planning">PLAN</span>
            <span class="phase-sep">›</span>
            <span class="phase-step" id="ph-development">DEV</span>
        </div>
        <div id="status-dot" title="Idle"></div>
        <button id="tg-btn" onclick="pairTelegram()" title="Pair Telegram" style="padding:2px 10px;background:#1a2a3a;color:#5ba3d9;border:1px solid #2a4a6a;border-radius:3px;font-size:11px;cursor:pointer;margin-left:4px;">TG</button>
    </div>

    <div id="input-bar">
        <textarea id="description-input" placeholder="Describe the project to build…" rows="1"></textarea>
        <button id="run-btn" onclick="startRun()">Run</button>
    </div>

    <div id="body">
        <div id="sidebar">
            <div id="tree-section" class="hidden">
                <div class="panel-header">OBJECTIVES</div>
                <div id="tree-wrap"></div>
            </div>
            <div class="panel-header">FILES</div>
            <div id="file-list"></div>
            <div id="hw-panel">
                <div class="hw-metric">
                    <span class="hw-label">VRAM</span>
                    <div class="bar-bg"><div id="vram-bar" class="bar-fill vram-fill"></div></div>
                    <span class="hw-val" id="vram-text">--%</span>
                </div>
                <div class="hw-metric">
                    <span class="hw-label">CPU</span>
                    <div class="bar-bg"><div id="cpu-bar" class="bar-fill cpu-fill"></div></div>
                    <span class="hw-val" id="cpu-text">--%</span>
                </div>
                <div class="hw-metric">
                    <span class="hw-label">RAM</span>
                    <div class="bar-bg"><div id="ram-bar" class="bar-fill ram-fill"></div></div>
                    <span class="hw-val" id="ram-text">--%</span>
                </div>
            </div>
        </div>

        <div id="main-view">
            <div id="editor-container"></div>
            <div id="wisdom-panel" class="hidden"></div>
            <div id="console-wrap">
                <div id="console-header">
                    CONSOLE
                    <span id="console-clear" onclick="document.getElementById('console').innerHTML=''">clear</span>
                </div>
                <div id="console"></div>
            </div>
            <div id="chat-wrap" class="hidden">
                <textarea id="chat-input" placeholder="Ask to modify the project… (Ctrl+Enter to send)"></textarea>
                <button id="chat-btn" onclick="sendModification()">Modify</button>
                <button id="refound-btn" onclick="sendRefound()" title="Refound project with condensed context" style="padding:5px 10px;background:#2d2010;color:#cca700;border:1px solid #cca700;border-radius:4px;font-size:11px;cursor:pointer;white-space:nowrap;">Refound</button>
            </div>
        </div>
    </div>

    <script>
        let editor;
        let files = {};
        let ramTotal = null;
        let activeFile = null;
        let currentProjectId = null;
        const phases = ['capabilities', 'requirements', 'architecture', 'planning', 'development'];

        // --- Monaco ---
        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs' } });
        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: '# SODA Mission Control — waiting for pipeline...',
                language: 'python', theme: 'vs-dark', automaticLayout: true,
                readOnly: true, minimap: { enabled: false }
            });
        });

        function langFromFilename(name) {
            const ext = name.split('.').pop().toLowerCase();
            const map = { py:'python', js:'javascript', ts:'typescript', html:'html', css:'css', json:'json', md:'markdown', yml:'yaml', yaml:'yaml', sh:'shell', txt:'plaintext' };
            return map[ext] || 'plaintext';
        }

        function iconFromFilename(name) {
            const ext = name.split('.').pop().toLowerCase();
            const map = { py:'[py]', js:'[js]', ts:'[ts]', html:'[html]', css:'[css]', json:'[json]', md:'[md]' };
            return map[ext] || '[file]';
        }

        function openFile(filename) {
            if (!editor) return;
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            const item = document.querySelector(`.file-item[data-file="${CSS.escape(filename)}"]`);
            if (item) item.classList.add('active');
            editor.setModel(monaco.editor.createModel(files[filename], langFromFilename(filename)));
            activeFile = filename;
        }

        // --- Objective tree ---
        function buildTree(levels) {
            const wrap = document.getElementById('tree-wrap');
            wrap.innerHTML = '';
            levels.forEach((mods, i) => {
                const lvl = document.createElement('div');
                lvl.className = 'tree-level';
                const label = document.createElement('div');
                label.className = 'tree-level-label';
                label.textContent = `Level ${i}${mods.length > 1 ? ' — parallel' : ''}`;
                const chips = document.createElement('div');
                chips.className = 'tree-modules';
                mods.forEach(mod => {
                    const chip = document.createElement('span');
                    chip.className = 'mod-chip';
                    chip.id = `mod-${mod}`;
                    chip.textContent = mod;
                    chips.appendChild(chip);
                });
                lvl.appendChild(label);
                lvl.appendChild(chips);
                wrap.appendChild(lvl);
            });
            document.getElementById('tree-section').classList.remove('hidden');
        }

        function setModuleState(modName, state) {
            const chip = document.getElementById(`mod-${modName}`);
            if (!chip) return;
            chip.className = `mod-chip ${state}`;
        }

        // --- Wisdom panel ---
        function renderWisdom(observations) {
            const panel = document.getElementById('wisdom-panel');
            panel.innerHTML = '';
            if (!observations || observations.length === 0) return;
            panel.classList.remove('hidden');
            observations.forEach(obs => {
                const item = document.createElement('div');
                item.className = 'wisdom-item';
                item.innerHTML = `
                    <span class="wisdom-tag ${obs.type}">${obs.type.replace('_', ' ')}</span>
                    <div class="wisdom-body">
                        <div class="wisdom-msg">${escapeHtml(obs.message)}</div>
                        ${obs.suggestion ? `<div class="wisdom-sug">${escapeHtml(obs.suggestion)}</div>` : ''}
                    </div>`;
                panel.appendChild(item);
            });
        }

        // --- Project Chat ---
        async function sendModification() {
            if (!currentProjectId) return;
            const input = document.getElementById('chat-input');
            const btn = document.getElementById('chat-btn');
            const request = input.value.trim();
            if (!request) { input.focus(); return; }

            input.disabled = true;
            btn.disabled = true;
            btn.textContent = 'Analyzing…';

            try {
                const res = await fetch('/api/modify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({project_id: currentProjectId, request}),
                });
                const data = await res.json();
                if (!res.ok) {
                    log(data.message || 'Modification failed', 'FAILED');
                } else {
                    input.value = '';
                }
            } catch(e) {
                log('Could not reach server', 'FAILED');
            } finally {
                input.disabled = false;
                btn.disabled = false;
                btn.textContent = 'Modify';
                input.focus();
            }
        }

        // --- Telegram pairing ---
        async function pairTelegram() {
            try {
                const status = await fetch('/api/telegram/status').then(r => r.json());
                if (status.configured) {
                    alert(`Telegram already paired (chat_id: ${status.chat_id}). To re-pair, clear soda_config.json.`);
                    return;
                }
                if (!status.has_token) {
                    alert('No TELEGRAM_BOT_TOKEN in .env. Add it and restart SODA.');
                    return;
                }
                const res = await fetch('/api/telegram/pair').then(r => r.json());
                alert(`Pairing code: ${res.code}\n\n${res.instruction}`);
                document.getElementById('tg-btn').style.color = '#cca700';
            } catch(e) {
                alert('Could not generate pairing code.');
            }
        }

        // Check Telegram status on load
        fetch('/api/telegram/status').then(r => r.json()).then(s => {
            const btn = document.getElementById('tg-btn');
            if (s.configured) { btn.style.color = '#4ec9b0'; btn.title = 'Telegram paired'; }
            else if (!s.has_token) { btn.style.opacity = '0.3'; btn.title = 'No TELEGRAM_BOT_TOKEN'; }
        }).catch(() => {});

        async function sendRefound() {
            if (!currentProjectId) return;
            if (!confirm('Refound this project? SODA will summarize it and start a clean pipeline with condensed context.')) return;
            document.getElementById('refound-btn').disabled = true;
            document.getElementById('chat-btn').disabled = true;
            try {
                const res = await fetch('/api/refound', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({project_id: currentProjectId}),
                });
                if (!res.ok) {
                    const err = await res.json();
                    log(err.message || 'Refoundation failed', 'FAILED');
                    document.getElementById('refound-btn').disabled = false;
                    document.getElementById('chat-btn').disabled = false;
                }
            } catch(e) {
                log('Could not reach server', 'FAILED');
                document.getElementById('refound-btn').disabled = false;
                document.getElementById('chat-btn').disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const chatInput = document.getElementById('chat-input');
            if (chatInput) {
                chatInput.addEventListener('keydown', e => {
                    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) sendModification();
                });
            }
        });

        // --- Run ---
        async function startRun() {
            const input = document.getElementById('description-input');
            const btn = document.getElementById('run-btn');
            const description = input.value.trim();
            if (!description) { input.focus(); return; }

            input.disabled = true;
            btn.disabled = true;
            btn.textContent = 'Running…';

            try {
                const res = await fetch('/api/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({description}),
                });
                if (!res.ok) {
                    const err = await res.json();
                    log(err.message || 'Failed to start', 'FAILED');
                    unlockInput();
                }
            } catch(e) {
                log('Could not reach server', 'FAILED');
                unlockInput();
            }
        }

        function unlockInput() {
            const input = document.getElementById('description-input');
            const btn = document.getElementById('run-btn');
            input.disabled = false;
            btn.disabled = false;
            btn.textContent = 'Run';
        }

        document.getElementById('description-input').addEventListener('keydown', e => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) startRun();
        });

        // --- Hardware polling ---
        async function updateStats() {
            try {
                const data = await fetch('/api/stats').then(r => r.json());
                const vPct = data.vram.total > 0 ? (data.vram.total - data.vram.free) / data.vram.total * 100 : 0;
                document.getElementById('vram-bar').style.width = vPct + '%';
                document.getElementById('vram-text').textContent = Math.round(vPct) + '%';

                document.getElementById('cpu-bar').style.width = data.system.cpu_usage + '%';
                document.getElementById('cpu-text').textContent = Math.round(data.system.cpu_usage) + '%';

                if (!ramTotal) {
                    const t = await fetch('/api/ram_total').then(r => r.json()).catch(() => null);
                    ramTotal = t?.ram_total_gb || 64;
                }
                const rPct = Math.max(0, 100 - data.system.ram_free_gb / ramTotal * 100);
                document.getElementById('ram-bar').style.width = rPct + '%';
                document.getElementById('ram-text').textContent = Math.round(rPct) + '%';

                if (data.recommendation) {
                    const [model, mode] = data.recommendation;
                    document.getElementById('model-badge').textContent = `${model} [${mode}]`;
                }
            } catch(e) {}
        }
        updateStats();
        setInterval(updateStats, 2000);

        // --- Phase tracker ---
        function setPhase(phase, allDone = false) {
            phases.forEach(p => {
                const el = document.getElementById('ph-' + p);
                if (!el) return;
                el.className = 'phase-step';
                if (allDone) { el.classList.add('done'); return; }
                if (p === phase) el.classList.add('active');
                else if (phases.indexOf(p) < phases.indexOf(phase)) el.classList.add('done');
            });
        }

        function setStatus(state) {
            const dot = document.getElementById('status-dot');
            dot.className = state;
        }

        // --- Console ---
        function log(message, type = 'LOG') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const ts = new Date().toTimeString().slice(0, 8);
            entry.innerHTML = `<span class="log-time">${ts}</span><span class="log-msg">${escapeHtml(message)}</span>`;
            const el = document.getElementById('console');
            el.appendChild(entry);
            el.scrollTop = el.scrollHeight;
        }

        function escapeHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        // --- WebSocket ---
        function connectWS() {
            const ws = new WebSocket(`ws://${window.location.host}/ws`);

            ws.onmessage = (event) => {
                const payload = JSON.parse(event.data);
                const type = payload.event_type || 'LOG';
                const msg  = payload.message || '';
                const data = payload.data || {};

                log(msg, type);

                switch (type) {
                    case 'START':
                        setStatus('running');
                        currentProjectId = data.project_id || null;
                        document.getElementById('file-list').innerHTML = '';
                        document.getElementById('tree-wrap').innerHTML = '';
                        document.getElementById('tree-section').classList.add('hidden');
                        document.getElementById('wisdom-panel').innerHTML = '';
                        document.getElementById('wisdom-panel').classList.add('hidden');
                        document.getElementById('chat-wrap').classList.add('hidden');
                        files = {};
                        phases.forEach(p => { const el = document.getElementById('ph-' + p); if(el) el.className = 'phase-step'; });
                        break;

                    case 'PHASE_START':
                        if (data.phase && data.phase !== 'wisdom' && data.phase !== 'modification') setPhase(data.phase);
                        break;

                    case 'CAPABILITIES':
                        if (data.profile) {
                            const skills = (data.skills || []).join(', ') || 'none';
                            log(`Profile: ${data.profile} | Skills: ${skills}`, 'CAPABILITIES');
                        }
                        break;

                    case 'WISDOM': {
                        const wisdomBuf = window._wisdomBuf = window._wisdomBuf || [];
                        if (data.type !== 'ok') {
                            wisdomBuf.push(data);
                            renderWisdom(wisdomBuf);
                        }
                        break;
                    }

                    case 'CHECKPOINT':
                        if (data.number === 3 && data.levels) buildTree(data.levels);
                        break;

                    case 'MODULE_START':
                        if (data.module) setModuleState(data.module, 'running');
                        break;

                    case 'MODULE_DONE':
                        if (data.module) setModuleState(data.module, 'done');
                        break;

                    case 'FILE_GENERATED': {
                        const { filename, code, validated } = data;
                        if (!filename || code === undefined) break;
                        files[filename] = code;
                        const item = document.createElement('div');
                        item.className = 'file-item';
                        item.dataset.file = filename;
                        item.innerHTML = `<span class="file-icon">${iconFromFilename(filename)}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(filename)}</span><span class="file-validated ${validated?'ok':'fail'}">${validated?'OK':'ERR'}</span>`;
                        item.onclick = () => openFile(filename);
                        document.getElementById('file-list').appendChild(item);
                        openFile(filename);
                        break;
                    }

                    case 'MODIFICATION_PLAN':
                        log(`[${data.change_type?.toUpperCase()}] ${data.impact_summary || data.description}`, 'MODIFICATION_PLAN');
                        break;

                    case 'IMPACT_REPORT': {
                        const affected = [...(data.directly_affected||[]), ...(data.transitively_affected||[])];
                        log(`Impact [${data.risk_level}] — affects: ${affected.join(', ') || 'none'}. ${data.risk_reason}`, 'IMPACT_REPORT');
                        affected.forEach(m => setModuleState(m, 'running'));
                        break;
                    }

                    case 'HEALTH_WARN':
                        log(`[HEALTH L${data.level}] ${data.reason}`, 'HEALTH_WARN');
                        break;

                    case 'EVOLUTION':
                        log(`Profile '${data.profile}' updated — ${data.count} learnings captured`, 'EVOLUTION');
                        break;

                    case 'BRANCH_CREATED':
                        log(`Branch created: ${data.branch_name} (${data.branch_id})`, 'BRANCH_CREATED');
                        break;

                    case 'REFOUNDATION':
                        log(`Refoundation initiated from project ${data.parent_id}`, 'REFOUNDATION');
                        break;

                    case 'DONE':
                        setPhase(null, true);
                        setStatus('done');
                        unlockInput();
                        window._wisdomBuf = [];
                        document.getElementById('chat-wrap').classList.remove('hidden');
                        break;

                    case 'FAILED':
                        setStatus('failed');
                        unlockInput();
                        break;
                }
            };

            ws.onclose = () => setTimeout(connectWS, 3000);
            ws.onerror = () => ws.close();
        }

        connectWS();

        // Restore locked state if server already running when UI opens
        fetch('/api/status').then(r => r.json()).then(d => {
            if (d.running) {
                document.getElementById('description-input').disabled = true;
                document.getElementById('run-btn').disabled = true;
                document.getElementById('run-btn').textContent = 'Running…';
            }
        }).catch(() => {});
    </script>
</body>
</html>
